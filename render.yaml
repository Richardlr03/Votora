services:
  - type: web
    name: voting-project
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -w 1 -k gthread --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_NOTIFY_EMAIL
        sync: false
      - key: SUPPORT_FROM_EMAIL
        sync: false
      - key: DEV_ADMIN_USERNAMES
        sync: false
