<div id="flagModal" role="dialog" aria-modal="true" aria-labelledby="flagModalTitle" style="display:none;position:fixed;inset:0;z-index:2100;background:rgba(15,23,42,.45);padding:16px;align-items:center;justify-content:center"><form class="bg-white rounded shadow" id="flagForm" style="width:min(520px,100%);max-height:90vh;overflow:auto"><div class="p-3 border-bottom d-flex align-items-center justify-content-between"><h2 id="flagModalTitle" class="fs-5 mb-0">Create moderation flag</h2><button type="button" class="btn-close" aria-label="Close" onclick="closeFlagModal()"></button></div><div class="p-3"><p id="flagTarget" class="fw-semibold"></p><input type="hidden" id="flagType"><input type="hidden" id="flagId"><label class="form-label" for="flagReason">Reason</label><textarea class="form-control" id="flagReason" required maxlength="8000" rows="4"></textarea><p id="flagError" class="text-danger small mt-2 mb-0"></p></div><div class="p-3 border-top text-end"><button class="mx-3 btn btn-secondary" type="button" onclick="closeFlagModal()">Cancel</button><button class="btn btn-danger" type="submit">Submit flag</button></div></form></div>
<script>
function openFlag(type, id, label) { document.getElementById('flagType').value=type; document.getElementById('flagId').value=id; document.getElementById('flagTarget').textContent=`Flag ${type}: ${label}`; document.getElementById('flagReason').value=''; document.getElementById('flagError').textContent=''; document.getElementById('flagModal').style.display='flex'; document.getElementById('flagReason').focus(); }
function openFlagFromButton(button) { openFlag(button.dataset.flagType, button.dataset.flagId, button.dataset.flagLabel); }
function closeFlagModal() { document.getElementById('flagModal').style.display='none'; }
document.getElementById('flagForm').addEventListener('submit', async (event) => { event.preventDefault(); const response=await fetch('{{ url_for("create_flag") }}',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({target_type:document.getElementById('flagType').value,target_id:document.getElementById('flagId').value,reason:document.getElementById('flagReason').value})}); const body=await response.json(); if(!response.ok){document.getElementById('flagError').textContent=body.error||'Could not submit flag.';return;} closeFlagModal(); showFlashModal('success','Flag submitted for superstaff review.'); });
</script>
